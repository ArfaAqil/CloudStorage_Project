version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'fiit_123' # Пароль для суперпользователя
      MYSQL_DATABASE: 'cloud_db'             # Название нашей базы данных
      MYSQL_USER: 'admin'               # Имя пользователя для нашего приложения
      MYSQL_PASSWORD: 'admin'      # Пароль для этого пользователя
    ports:
      - "3306:3306" 
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: