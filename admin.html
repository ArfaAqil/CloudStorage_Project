<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkCloud - Админ-панель</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/admin.css"> <!-- Новые стили для этой страницы -->
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>WorkCloud</h2>
            <nav>
                <ul id="main-nav">
                    <!-- Навигация будет добавлена с помощью JS -->
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header>
                <h1>Админ-панель</h1>
            </header>
            <section class="admin-section">
                <h2>Управление пользователями</h2>
                <div class="table-container">
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>Имя</th>
                                <th>Email</th>
                                <th>Роль</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Пользователи будут загружены сюда -->
                        </tbody>
                    </table>
                </div>
            </section>
            <section class="admin-section">
                <h2>Логи аудита</h2>
                <div id="audit-log" class="log-container">
                    <!-- Логи будут загружены сюда -->
                </div>
            </section>
        </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
    <script>
        requireAuth();
        setupNavigation('admin.html');
    </script>
</body>
</html>
